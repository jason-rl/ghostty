name: Fork release
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jason-rl/ghostty'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Match Ghostty's upstream release toolchain. Newer default SDKs can
      # fail to link Zig 0.15.2's build runner before compiling the project.
      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - uses: cachix/install-nix-action@1ca7d21a94afc7c957383a2d217460d980de4934 # v31.10.1
      - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: ghostty
      - name: Build optimized GhosttyKit
        run: |
          version=$(python3 -c 'import re; print(re.search(r"\.version = \"([0-9]+\.[0-9]+\.[0-9]+)\"", open("build.zig.zon").read()).group(1))')
          nix develop -c zig build -Doptimize=ReleaseFast -Dstrip=false \
            -Demit-macos-app=false -Dxcframework-target=native "-Dversion-string=$version"
      - name: Build native Release app
        run: nix develop -c nu macos/build.nu --configuration Release --arch arm64 --unsigned --optimize-runtime
      - name: Package and verify
        run: python3 dist/fork/package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: fork-release
          path: zig-out/fork-release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: fork-release
          path: release
      - name: Publish version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("release/fork-release.json"))["version"])')
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag --yes
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" \
            --title "Ghostty $version" --latest --generate-notes
